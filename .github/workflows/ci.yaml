name: CI/CD Pipeline

on:
  push:
    branches:
      - "version-*"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build Docker image
        run: docker build -t food-delivery-app .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag and push Docker image
        run: |
          docker tag food-delivery-app ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.ref_name }}
          docker tag food-delivery-app ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

          docker push ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

  deploy:
    name: Deploy to VM (provisioned via Terraform)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/gcp_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_IP }} << 'EOF'
            echo "Pulling new version: ${{ github.sha }}..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

            echo "Stopping old container..."
            docker stop app || true
            docker rm app || true

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Starting new container..."
            docker run -d -p 80:3000 --name app \
              ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

            echo "Deployment of ${{ github.sha }} successful."
          EOF