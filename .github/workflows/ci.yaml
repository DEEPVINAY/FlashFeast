name: CI/CD Pipeline

on:
  push:
    branches:
      - "version-*"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build Docker image
        run: docker build -t food-delivery-app .

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Tag Docker image
        run: |
          docker tag food-delivery-app ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.ref_name }}
          docker tag food-delivery-app ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

  deploy:
    name: Deploy to Compute Engine
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure project
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy application
        run: |
          gcloud compute ssh flash-feast \
            --zone=asia-south1-a \
            --command="
              echo 'Pulling latest image...'

              docker pull ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

              echo 'Stopping old container...'

              docker stop app || true
              docker rm app || true

              echo 'Cleaning old images...'

              docker image prune -af

              echo 'Starting new container...'

              docker run -d \
                --restart unless-stopped \
                --name app \
                -p 80:3000 \
                ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

              echo 'Deployment completed successfully.'
            "