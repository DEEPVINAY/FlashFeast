name: CI/CD Pipeline

on:
  push:
    branches:
      - "version-*"
      - "main"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }}

  deploy:
    name: Deploy to Google Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        id: deploy_run
        run: |
          gcloud run deploy flash-feast \
            --image ${{ secrets.DOCKER_USERNAME }}/food-delivery-app:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}"

          # Capture service URL
          SERVICE_URL=$(gcloud run services describe flash-feast --platform managed --region asia-south1 --format 'value(status.url)')
          echo "Service deployed successfully at: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Record Deployment in Neon Postgres
        if: always()
        run: |
          STATUS="${{ steps.deploy_run.outcome == 'success' && 'success' || 'failure' }}"
          npm ci
          node -e '
            import("./server/db.js").then(async ({ query }) => {
              try {
                await query(`
                  INSERT INTO deployments (
                    app, environment, version, status, duration_sec, source_account
                  ) VALUES ($1, $2, $3, $4, $5, $6)
                `, [
                  "FlashFeast",
                  "production",
                  "${{ github.ref_name }} (${{ github.sha }})",
                  process.env.DEPLOY_STATUS,
                  Math.floor(process.uptime()),
                  "${{ github.actor }}"
                ]);
                console.log("✅ Deployment recorded to Neon PostgreSQL.");
                process.exit(0);
              } catch (e) {
                console.error("Failed to record deployment:", e.message);
                process.exit(0);
              }
            });
          '
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_STATUS: ${{ steps.deploy_run.outcome == 'success' && 'success' || 'failure' }}